services:
  - type: web
    name: careconnect-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: careconnect-postgres
    databaseName: careconnect_db
    user: careconnect
    plan: free
